{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card glass-card" data-animate="fadeInUp">
                    <div class="auth-header text-center">
                        <div class="auth-icon">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h2 class="mb-1">Welcome Back</h2>
                        <p class="text-muted">Log in to access brain MRI analysis</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}" id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="bi bi-envelope me-1"></i>Email Address
                            </label>
                            <input type="email" class="form-control glass-input" id="email" 
                                   name="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1"></i>Password
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control glass-input" id="password" 
                                       name="password" placeholder="Enter your password" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-accent w-100 btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                        </button>
                    </form>

                    <div class="auth-footer text-center mt-4">
                        <p class="text-muted mb-0">
                            Don't have an account? 
                            <a href="{{ url_for('register') }}" class="text-accent">Register Now</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
